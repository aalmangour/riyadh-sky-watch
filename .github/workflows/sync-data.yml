name: Sync data from the Claude artifact
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-data.yml"
      - ".diag/trigger.txt"
  schedule:
    - cron: "12,42 * * * *"
permissions:
  contents: write
concurrency:
  group: sync-data
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch data.json from the artifact frame host
        id: fetch
        shell: bash
        run: |
          set +e
          mkdir -p .diag
          H="https://93ced6a1-90b0-48cd-befe-0ab4bd6e9b8f.frame.claudeusercontent.com"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          {
            echo "probe at $(date -u +%FT%TZ)"
            for u in "$H/" "$H/data.json" "$H/index.html"; do
              code=$(curl -sL -A "$UA" -o /tmp/out -w "%{http_code} %{url_effective} %{content_type}" "$u")
              echo "GET $u -> $code"; head -c 200 /tmp/out | tr '\n' ' '; echo; echo "=========="
            done
          } > .diag/probe.txt 2>&1
          cat .diag/probe.txt
          code=$(curl -sL -A "$UA" -o /tmp/data.json -w "%{http_code}" "$H/data.json")
          echo "data.json status: $code"
          if [ "$code" = "200" ] && python3 -c "import json,sys; d=json.load(open('/tmp/data.json')); assert d.get('schema')==1 and 'incidents' in d; print('valid, generated_at', d['generated_at'])"; then
            NEW=$(python3 -c "import json;print(json.load(open('/tmp/data.json'))['generated_at'])")
            OLD=$(python3 -c "import json;print(json.load(open('data.json'))['generated_at'])" 2>/dev/null || echo "")
            echo "artifact: $NEW | repo: $OLD"
            if [ "$NEW" != "$OLD" ]; then cp /tmp/data.json data.json; echo "updated=1" >> "$GITHUB_OUTPUT"; else echo "updated=0" >> "$GITHUB_OUTPUT"; fi
          else
            echo "updated=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit
        shell: bash
        run: |
          git config user.name "sky-watch-bot"
          git config user.email "noreply@github.com"
          git add .diag/probe.txt data.json
          git commit -m "sync: data from artifact ($(date -u +%FT%TZ))" || echo "nothing to commit"
          git push
